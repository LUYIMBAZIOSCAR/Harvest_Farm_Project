{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Harvest Farm is a sustainable agricultural learning and production centre focused on poultry, goats, dairy, and banana farming.{% endblock %}">
    <title>{% block title %}Harvest Farm{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=20261115">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include 'includes/navbar.html' %}
    {% include 'includes/messages.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <a href="https://wa.me/{{ whatsapp_number|cut:'+'|default:'256000000000' }}?text=Hello%20Harvest%20Farm%2C%20I%20visited%20your%20website%20and%20would%20like%20to%20make%20an%20enquiry." class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Chat with Harvest Farm on WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}?v=20261115"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
